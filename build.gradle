plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
   // testImplementation 'org.testng:testng:7.6.1'
    //implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    //testImplementation 'io.github.bonigarcia:webdrivermanager:5.4.1'
    testImplementation 'org.testng:testng:7.9.0' // Latest stable TestNG
    implementation 'org.seleniumhq.selenium:selenium-java:4.21.0' // Latest Selenium 4
    implementation 'io.github.bonigarcia:webdrivermanager:5.8.0' // Latest WDM
    implementation 'io.cucumber:cucumber-testng:7.15.0'
    implementation 'io.cucumber:cucumber-core:7.15.0'
    implementation 'io.cucumber:cucumber-java:7.15.0'
    implementation 'io.cucumber:gherkin:27.0.0'

}

test {
    useTestNG() {
        suites "src/test/resources/TestNG.xml"
        systemProperty"browser",System.getProperty("browser")
    }
}